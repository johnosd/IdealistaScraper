<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coleta de anúncios</title>
<style>body{font:16px system-ui;max-width:960px;margin:30px auto;padding:0 20px;color:#172033}label{display:block;margin-top:10px}input[type=url]{width:90%;padding:8px}button{padding:8px;margin:8px 8px 8px 0}section{border-top:1px solid #cbd5e1;margin-top:20px;padding-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#collection-policy{display:grid;grid-template-columns:1fr 1fr;gap:8px}#collection-policy br{display:none}input[type=number]{width:90%;display:block}</style></head>
<body><main><h1>Coleta de anúncios</h1><p>O progresso confirmado pode ser recuperado após fechar esta tela. A retomada é manual.</p>
<label for="items-url">Página de resultados do Idealista</label><input id="items-url" type="url" required placeholder="https://www.idealista.pt/…">
<label><input id="items-proxy" type="checkbox">Usar proxy configurado</label><button id="items-start">Iniciar coleta</button>
<p id="items-status" role="status" aria-live="polite">Carregando…</p>
<p>Após o download, confirme em “Já baixei este resultado”. Se houve interrupção, confira seus arquivos antes de baixar novamente.</p></main>
<script src="dist/itens.bundle.js"></script></body></html>
